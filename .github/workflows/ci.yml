name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  extension-test:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint extension
        run: pnpm --filter=extension lint

      - name: Test continue-watching keep-alive / dismisser
        run: pnpm --filter=extension test

      - name: Build extension
        run: pnpm --filter=extension build

      - name: Verify browser room, public pages, and appearance assets
        env:
          VITE_PARTY_API_ORIGIN: http://127.0.0.1:3033
        run: |
          pnpm --filter=web lint
          pnpm --filter=web test
          pnpm --filter=web build
          pnpm --filter=web-landing test
          pnpm --filter=backend test:homepage
          node scripts/sync-appearance.mjs --check
          node --test scripts/appearance*.test.mjs
