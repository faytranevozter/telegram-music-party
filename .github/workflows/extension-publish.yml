name: Extension Publish to Chrome Web Store

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      check_credentials:
        description: "Verify OAuth and item access without uploading"
        type: boolean
        default: false
      publish:
        description: "Upload and submit for Chrome Web Store review (false = build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('apps/extension/public/manifest.json', 'utf8'));
          const version = process.env.REF_TYPE === 'tag' ? process.env.REF_NAME.replace(/^v/, '') : manifest.version;
          const parts = version.split('.');
          if (parts.length < 2 || parts.length > 4 || parts.some(p => !/^(0|[1-9]\d*)$/.test(p) || Number(p) > 65535) || parts.every(p => Number(p) === 0)) {
            throw new Error(`Invalid Chrome extension version: ${version}`);
          }
          if (version !== manifest.version) throw new Error('Tag and committed manifest version must match; bump version before tagging.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=extension lint
      - run: pnpm --filter=extension test
      - run: pnpm --filter=extension build

      - name: Package extension
        run: cd apps/extension/dist && zip -r "$GITHUB_WORKSPACE/extension-webstore.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: extension-webstore-${{ steps.version.outputs.version }}
          path: extension-webstore.zip
          if-no-files-found: error

      - name: Check credentials or submit for review
        if: github.event_name == 'push' || inputs.publish == true || inputs.check_credentials == true
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: pdibhcofofkfblpajpjcpopbbbbbncbk
          CHECK_ONLY: ${{ inputs.check_credentials }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python3 scripts/publish-chrome-extension.py --check-only
          else
            python3 scripts/publish-chrome-extension.py extension-webstore.zip
          fi
