name: Deploy Web Landing

# Deploys apps/web-landing (ytparty.my.id) to Cloudflare Workers.
#
# Required repository secret: CLOUDFLARE_API_TOKEN (Workers:Edit permission).
# Optional: CLOUDFLARE_ACCOUNT_ID (defaults to the token's account).

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web-landing/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PRIVACY.md and TERMS.md are the source of truth for /privacy and
      # /terms. Regenerate so the deployed pages always match the repository.
      - name: Build styles and legal pages
        run: pnpm --filter=web-landing build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-landing
          packageManager: pnpm
          command: deploy --env=""
