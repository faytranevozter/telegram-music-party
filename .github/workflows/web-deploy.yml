name: Deploy Web Landing

# Deploys apps/web-landing (ytparty.my.id) to Cloudflare Workers.
#
# Required repository secret: CLOUDFLARE_API_TOKEN (Workers:Edit permission).
# Optional: CLOUDFLARE_ACCOUNT_ID (defaults to the token's account).

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web-landing/**"
      - "PRIVACY.md"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PRIVACY.md is the source of truth for /privacy. Regenerate so the
      # deployed page always matches the repository.
      - name: Generate privacy page
        run: pnpm --filter=web-landing build:privacy

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web-landing
          command: deploy --env=""
