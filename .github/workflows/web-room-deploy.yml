name: Deploy Web Room

# Deploys apps/web (room.ytparty.my.id) to the existing ytparty-room Worker.
# Uses the same Cloudflare repository secrets as web-deploy.yml.

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-room-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-room

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build room frontend
        env:
          VITE_PARTY_API_ORIGIN: https://music.ytparty.my.id
        run: pnpm --filter=web build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: "4.154.0"
          command: deploy
